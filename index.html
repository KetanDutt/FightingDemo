<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Monkey Mayhem — Fighting Demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Monkey Mayhem - a polished 2D fighting game demo built with Phaser 3."
    />
    <meta name="theme-color" content="#0d1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Monkey Mayhem — Fighting Demo" />
    <meta
      property="og:description"
      content="A polished 2D fighting game demo built with Phaser 3."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%B5%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Shown until Phaser has booted; removed by src/main.js -->
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-splash__inner">
        <div class="boot-splash__emoji">🐵</div>
        <h1 class="boot-splash__title">Monkey Mayhem</h1>
        <div class="boot-splash__bar"><span></span></div>
        <p class="boot-splash__hint">Loading the arena…</p>
      </div>
    </div>

    <noscript>
      <div class="noscript">This game needs JavaScript enabled to run.</div>
    </noscript>

    <div id="game" aria-label="Game canvas" role="application"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
