<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Monkey Mayhem — Fighting Demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Monkey Mayhem - a polished 2D fighting game demo built with Phaser 3."
    />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Monkey Mayhem — Fighting Demo" />
    <meta
      property="og:description"
      content="A polished 2D fighting game demo built with Phaser 3."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Ccircle cx='22' cy='30' r='13' fill='%23ffc93c'/%3E%3Ccircle cx='74' cy='30' r='13' fill='%23ffc93c'/%3E%3Ccircle cx='22' cy='30' r='6' fill='%230b0f1a'/%3E%3Ccircle cx='74' cy='30' r='6' fill='%230b0f1a'/%3E%3Ccircle cx='48' cy='52' r='30' fill='%23ffc93c'/%3E%3Cellipse cx='48' cy='63' rx='17' ry='13' fill='%230b0f1a'/%3E%3Ccircle cx='40' cy='44' r='4' fill='%230b0f1a'/%3E%3Ccircle cx='56' cy='44' r='4' fill='%230b0f1a'/%3E%3Cpath d='M42 65q6 5 12 0' stroke='%23ffc93c' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Shown until Phaser has booted; removed by src/main.js -->
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-splash__inner">
        <svg class="boot-splash__mark" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
          <circle cx="22" cy="30" r="13" fill="#ffc93c" />
          <circle cx="74" cy="30" r="13" fill="#ffc93c" />
          <circle cx="22" cy="30" r="6" fill="#0b0f1a" />
          <circle cx="74" cy="30" r="6" fill="#0b0f1a" />
          <circle cx="48" cy="52" r="30" fill="#ffc93c" />
          <ellipse cx="48" cy="63" rx="17" ry="13" fill="#0b0f1a" />
          <circle cx="40" cy="44" r="4" fill="#0b0f1a" />
          <circle cx="56" cy="44" r="4" fill="#0b0f1a" />
          <path
            d="M42 65q6 5 12 0"
            stroke="#ffc93c"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />
        </svg>
        <h1 class="boot-splash__title">Monkey Mayhem</h1>
        <div class="boot-splash__bar"><span></span></div>
        <p class="boot-splash__hint">Loading the arena…</p>
      </div>
    </div>

    <noscript>
      <div class="noscript">This game needs JavaScript enabled to run.</div>
    </noscript>

    <div id="game" aria-label="Game canvas" role="application"></div>
    <script type="module" src="./src/main.js"></script>
    <script>
      // Last-resort boot failure notice (the module above sets this marker).
      window.setTimeout(function () {
        if (!window.MonkeyMayhem) {
          var hint = document.querySelector('.boot-splash__hint');
          if (hint)
            hint.textContent =
              'The game scripts failed to load — check your connection and reload the page.';
        }
      }, 12000);
    </script>
  </body>
</html>
